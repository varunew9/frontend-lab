<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Vibrant Gradient for the Background Ring and First Letter -->
    <linearGradient id="cursive-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>
  
  <!-- Premium Dark Background -->
  <rect width="300" height="300" rx="60" fill="#0B0F19" />
  
  <!-- Elegant Thin Geometric Ring -->
  <circle cx="150" cy="150" r="115" fill="none" stroke="url(#cursive-grad)" stroke-width="2" opacity="0.3" stroke-dasharray="8 4" />

  <!-- Cursive "VV" Monogram Group -->
  <g transform="translate(10, 5)">
    <!-- First 'V' (Gradient Accent) -->
    <path d="M 60 110 C 75 80, 90 90, 95 110 C 105 150, 115 210, 125 210 C 135 210, 155 140, 165 100 C 170 80, 160 80, 150 85" 
          fill="none" stroke="url(#cursive-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Second 'V' (Crisp White, Overlapping) -->
    <path d="M 120 110 C 135 80, 150 90, 155 110 C 165 150, 175 210, 185 210 C 195 210, 215 140, 225 100 C 230 80, 220 80, 210 85" 
          fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95" />
          
    <!-- Decorative Flourish Dot -->
    <circle cx="215" cy="84" r="5" fill="#EC4899" />
  </g>
</svg>
